<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#34295d" />
  <title>SafeSphere — Your safety, in your hands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" aria-label="Go to SafeSphere home" data-go="home"><span class="brand-mark">S</span><span>SafeSphere</span></button>
      <div class="top-actions"><span class="status-dot"></span><span class="status-text">Safety ready</span><button class="icon-button" data-go="help" aria-label="Get help now">?</button></div>
    </header>

    <main id="app" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" data-go="home"><span>⌂</span>Home</button>
      <button class="nav-item" data-go="safety"><span>✦</span>Safety</button>
      <button class="nav-help" data-go="help"><span>!</span><small>Help now</small></button>
      <button class="nav-item" data-go="reports"><span>▤</span>Reports</button>
      <button class="nav-item" data-go="online"><span>◎</span>Online</button>
    </nav>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
